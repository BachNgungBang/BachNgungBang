<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
  <title id="title">Artemis Cutie learning roadmap</title>
  <desc id="desc">A cyber neon vertical roadmap from web foundations through backend systems and AI applications to deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#060711"/><stop offset=".5" stop-color="#0d0923"/><stop offset="1" stop-color="#061827"/></linearGradient>
    <linearGradient id="rail" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#a855f7"/><stop offset=".45" stop-color="#38bdf8"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-15%" y="-20%" width="130%" height="140%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="1280" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="1280" rx="24" fill="url(#grid)"/>
  <rect x="22" y="22" width="1156" height="1236" rx="17" fill="none" stroke="#38bdf8" stroke-opacity=".42"/>
  <path d="M50 22h130M22 50v85M1020 1258h130M1178 1145v85" fill="none" stroke="#c4b5fd" stroke-width="3" filter="url(#glow)"/>

  <g font-family="Consolas, 'Courier New', monospace">
    <text x="70" y="82" fill="#38bdf8" font-size="15" letter-spacing="2">// OPERATOR ROADMAP / DIRECTIONAL PATH</text>
    <text x="70" y="128" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="36" font-weight="800">FROM WEB SIGNAL TO AI SYSTEMS</text>
    <text x="70" y="160" fill="#c4b5fd" font-size="15">Each node is unlocked through builds, documentation, and deliberate practice.</text>
  </g>

  <path d="M600 220V1160" stroke="url(#rail)" stroke-width="5" filter="url(#soft)"/>
  <path d="M600 220V1160" stroke="#e9d5ff" stroke-opacity=".28" stroke-width="1" stroke-dasharray="4 12"/>

  <!-- 01 WEB FOUNDATION -->
  <g font-family="Consolas, 'Courier New', monospace">
    <circle cx="600" cy="250" r="18" fill="#120a2d" stroke="#a855f7" stroke-width="4" filter="url(#glow)"/><text x="600" y="255" text-anchor="middle" fill="#f5f3ff" font-size="12">01</text>
    <path d="M582 250H475" stroke="#a855f7" stroke-width="2"/>
    <rect x="70" y="205" width="405" height="92" rx="14" fill="#110b27" stroke="#a855f7" stroke-opacity=".8"/>
    <text x="96" y="237" fill="#e9d5ff" font-size="18" font-weight="700">WEB FOUNDATION</text>
    <text x="96" y="268" fill="#c4b5fd" font-size="15">HTML  ·  CSS  ·  JavaScript  ·  Git</text>
    <text x="96" y="287" fill="#8b9bb4" font-size="12">semantic UI / browser logic / version control</text>
  </g>

  <!-- 02 INTERFACE -->
  <g font-family="Consolas, 'Courier New', monospace">
    <circle cx="600" cy="405" r="18" fill="#071d31" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/><text x="600" y="410" text-anchor="middle" fill="#f5f3ff" font-size="12">02</text>
    <path d="M618 405H725" stroke="#38bdf8" stroke-width="2"/>
    <rect x="725" y="360" width="405" height="92" rx="14" fill="#071a2b" stroke="#38bdf8" stroke-opacity=".8"/>
    <text x="751" y="392" fill="#dbeafe" font-size="18" font-weight="700">INTERFACE &amp; ENVIRONMENT</text>
    <text x="751" y="423" fill="#7dd3fc" font-size="15">React  ·  Linux  ·  Python</text>
    <text x="751" y="442" fill="#8b9bb4" font-size="12">component thinking / command line / scripting</text>
  </g>

  <!-- 03 CORE BACKEND -->
  <g font-family="Consolas, 'Courier New', monospace">
    <circle cx="600" cy="560" r="18" fill="#120a2d" stroke="#a855f7" stroke-width="4" filter="url(#glow)"/><text x="600" y="565" text-anchor="middle" fill="#f5f3ff" font-size="12">03</text>
    <path d="M582 560H475" stroke="#a855f7" stroke-width="2"/>
    <rect x="70" y="510" width="405" height="102" rx="14" fill="#110b27" stroke="#a855f7" stroke-opacity=".8"/>
    <text x="96" y="542" fill="#e9d5ff" font-size="18" font-weight="700">CORE BACKEND</text>
    <text x="96" y="573" fill="#c4b5fd" font-size="15">Java  ·  SQL  ·  OOP  ·  REST API</text>
    <text x="96" y="594" fill="#8b9bb4" font-size="12">data models / abstractions / service contracts</text>
  </g>

  <!-- 04 FRAMEWORKS -->
  <g font-family="Consolas, 'Courier New', monospace">
    <circle cx="600" cy="725" r="18" fill="#071d31" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/><text x="600" y="730" text-anchor="middle" fill="#f5f3ff" font-size="12">04</text>
    <path d="M618 725H725" stroke="#38bdf8" stroke-width="2"/>
    <rect x="725" y="675" width="405" height="102" rx="14" fill="#071a2b" stroke="#38bdf8" stroke-opacity=".8"/>
    <text x="751" y="707" fill="#dbeafe" font-size="18" font-weight="700">BACKEND FRAMEWORKS</text>
    <text x="751" y="738" fill="#7dd3fc" font-size="15">FastAPI  ·  Spring Boot  ·  Docker</text>
    <text x="751" y="759" fill="#8b9bb4" font-size="12">production services / containers / API delivery</text>
  </g>

  <!-- 05 SYSTEMS -->
  <g font-family="Consolas, 'Courier New', monospace">
    <circle cx="600" cy="895" r="18" fill="#120a2d" stroke="#a855f7" stroke-width="4" filter="url(#glow)"/><text x="600" y="900" text-anchor="middle" fill="#f5f3ff" font-size="12">05</text>
    <path d="M582 895H475" stroke="#a855f7" stroke-width="2"/>
    <rect x="70" y="845" width="405" height="102" rx="14" fill="#110b27" stroke="#a855f7" stroke-opacity=".8"/>
    <text x="96" y="877" fill="#e9d5ff" font-size="18" font-weight="700">SYSTEMS &amp; SCALE</text>
    <text x="96" y="908" fill="#c4b5fd" font-size="15">Redis  ·  RabbitMQ</text>
    <text x="96" y="929" fill="#8b9bb4" font-size="12">cache strategy / asynchronous messaging</text>
  </g>

  <!-- 06 AI -->
  <g font-family="Consolas, 'Courier New', monospace">
    <circle cx="600" cy="1050" r="18" fill="#071d31" stroke="#f0abfc" stroke-width="4" filter="url(#glow)"/><text x="600" y="1055" text-anchor="middle" fill="#f5f3ff" font-size="12">06</text>
    <path d="M618 1050H725" stroke="#f0abfc" stroke-width="2"/>
    <rect x="725" y="990" width="405" height="122" rx="14" fill="#1a0b2a" stroke="#f0abfc" stroke-opacity=".85"/>
    <text x="751" y="1022" fill="#fce7f3" font-size="18" font-weight="700">AI APPLICATIONS</text>
    <text x="751" y="1053" fill="#f0abfc" font-size="15">AI  ·  Machine Learning  ·  LLM  ·  RAG</text>
    <text x="751" y="1074" fill="#8b9bb4" font-size="12">models / retrieval / useful product integration</text>
    <text x="751" y="1094" fill="#7dd3fc" font-size="14">→ Deployment: turn experiments into usable systems</text>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="12">
    <rect x="70" y="1190" width="1060" height="38" rx="9" fill="#080b18" stroke="#38bdf8" stroke-opacity=".35"/>
    <circle cx="100" cy="1209" r="5" fill="#a855f7"/><text x="114" y="1214" fill="#c4b5fd">web core</text>
    <circle cx="273" cy="1209" r="5" fill="#38bdf8"/><text x="287" y="1214" fill="#7dd3fc">backend systems</text>
    <circle cx="502" cy="1209" r="5" fill="#f0abfc"/><text x="516" y="1214" fill="#f0abfc">AI applications</text>
    <text x="835" y="1214" fill="#e9d5ff">BUILD → DOCUMENT → ITERATE → DEPLOY</text>
  </g>
</svg>
