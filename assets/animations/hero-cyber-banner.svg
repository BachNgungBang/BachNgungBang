<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Artemis Cutie cyber matrix profile banner</title>
  <desc id="desc">Purple and blue neon banner identifying Artemis Cutie as a Year 2 Web Development Student on a backend and AI application path.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#050610"/>
      <stop offset=".55" stop-color="#0c0920"/>
      <stop offset="1" stop-color="#061424"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop stop-color="#7c3aed"/>
      <stop offset=".5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#191044" stop-opacity=".82"/>
      <stop offset="1" stop-color="#0a2033" stop-opacity=".28"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="matrixClip"><rect x="805" y="28" width="350" height="304" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#canvas)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M-40 314C210 180 324 402 558 258S892 126 1240 40" fill="none" stroke="#7c3aed" stroke-opacity=".21" stroke-width="2"/>
  <path d="M-60 336C198 208 346 392 610 236S925 160 1240 62" fill="none" stroke="#38bdf8" stroke-opacity=".2" stroke-width="1"/>

  <rect x="20" y="20" width="1160" height="320" rx="18" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#softGlow)"/>
  <path d="M44 20h128M20 44v72M1028 340h128M1180 244v72" fill="none" stroke="#e9d5ff" stroke-width="3" filter="url(#glow)"/>

  <g font-family="Consolas, 'Courier New', monospace" letter-spacing="2">
    <text x="70" y="78" fill="#38bdf8" font-size="14">// NEURAL NIGHTSHIFT / OPERATOR_2007</text>
    <circle cx="72" cy="109" r="5" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="88" y="114" fill="#c4b5fd" font-size="13">SYSTEM ONLINE</text>
    <text x="70" y="176" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-2">ARTEMIS</text>
    <text x="70" y="232" fill="#38bdf8" font-family="Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-2" filter="url(#softGlow)">CUTIE</text>
    <rect x="70" y="253" width="570" height="1" fill="url(#neon)"/>
    <text x="70" y="284" fill="#ddd6fe" font-size="17">YEAR 2 WEB DEVELOPMENT STUDENT</text>
    <text x="70" y="313" fill="#7dd3fc" font-size="14">BACKEND PATH  //  AI APPLICATION BUILDER</text>
  </g>

  <g clip-path="url(#matrixClip)" font-family="Consolas, 'Courier New', monospace" font-size="13">
    <rect x="805" y="28" width="350" height="304" rx="16" fill="url(#panel)" stroke="#38bdf8" stroke-opacity=".45"/>
    <g fill="#38bdf8" opacity=".7">
      <text x="828" y="67">01001001 01000001 01011111</text><text x="860" y="92">&gt; build /api/future</text>
      <text x="818" y="117">{ neural: "online" }</text><text x="890" y="142">01101110 01101111</text>
      <text x="833" y="167">&gt; learn --backend</text><text x="878" y="192">AI // SYSTEMS // WEB</text>
      <text x="819" y="217">01000001 01010010 01010100</text><text x="862" y="242">&gt; ship meaningful work</text>
      <text x="838" y="267">{ status: "leveling_up" }</text><text x="882" y="292">01000101 01001101</text>
    </g>
    <rect x="808" y="28" width="4" height="304" fill="#a855f7" opacity=".75">
      <animate attributeName="y" values="28;332;28" dur="5s" repeatCount="indefinite"/>
    </rect>
    <path d="M824 308h307" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
  </g>

  <rect x="20" y="20" width="1160" height="320" rx="18" fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="8">
    <animate attributeName="stroke-opacity" values=".12;.55;.12" dur="3.8s" repeatCount="indefinite"/>
  </rect>
</svg>
