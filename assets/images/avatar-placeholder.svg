<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Artemis Cutie avatar placeholder</title>
  <desc id="desc">A purple and blue neon hexagonal placeholder avatar bearing the letter A.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14052f"/><stop offset="1" stop-color="#061d32"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="240" height="240" rx="120" fill="#050610"/>
  <path d="M120 15l91 52v106l-91 52-91-52V67z" fill="url(#bg)" stroke="url(#line)" stroke-width="4" filter="url(#glow)"/>
  <path d="M120 39l70 40v82l-70 40-70-40V79z" fill="none" stroke="#c4b5fd" stroke-opacity=".38"/>
  <circle cx="120" cy="120" r="58" fill="#0a1026" stroke="#38bdf8" stroke-opacity=".45"/>
  <text x="120" y="147" text-anchor="middle" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="90" font-weight="800" filter="url(#glow)">A</text>
  <circle cx="184" cy="58" r="6" fill="#38bdf8"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
</svg>
